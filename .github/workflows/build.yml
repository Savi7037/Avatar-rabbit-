name: Build Avatar Rabbit

on:
  workflow_dispatch:
  push:
    paths:
      - "project.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir work
          unzip -q project.zip -d work

      - name: Install Blender
        run: |
          set -e
          for v in 4.2.3 4.2.2 4.2.1; do
            url="https://download.blender.org/release/Blender4.2/blender-$v-linux-x64.tar.xz"
            if curl -fsSL -o blender.tar.xz "$url"; then echo "downloaded $v"; break; fi
          done
          mkdir -p "$HOME/blender"
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1
          echo "$HOME/blender" >> "$GITHUB_PATH"
          "$HOME/blender/blender" --version | head -1

      - name: Render rabbit sprites
        working-directory: work
        run: |
          mkdir -p app/src/main/assets/sprites
          blender -b -P tools/render_sprites.py -- bunny.glb app/src/main/assets/sprites
          count=$(ls app/src/main/assets/sprites/*.png | wc -l)
          echo "rendered $count frames"
          [ "$count" -ge 40 ]

      - name: Save sprite preview
        uses: actions/upload-artifact@v4
        with:
          name: sprites-preview
          path: work/app/src/main/assets/sprites

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build APK
        working-directory: work
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AvatarRabbit-APK
          path: work/app/build/outputs/apk/debug/app-debug.apk
